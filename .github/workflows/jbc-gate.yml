name: JBC v1.3 Statutory Gate

on:
  push:
    branches:
      - main
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jbc-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jbc-gate:
    name: Enforce JBC v1.3, Blueprint LVS, Z3 Contracts, & PCE Dossier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with full Git graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install Python 3.14 and sync dependencies
        run: |
          uv python install 3.14
          uv sync --all-groups

      - name: Traditional CI — Ruff, Mypy --strict, & Pytest
        run: |
          uv run ruff check .
          uv run mypy .
          uv run pytest

      - name: Statutory Gate — Jezz JBC v1.3, Blueprint LVS, Z3 Proofs, & PCE Dossier
        uses: futileandstupid/jezz@v0.6.1
        with:
          mode: ${{ github.event_name == 'pull_request' && 'both' || 'full' }}
          language: "python"
          blueprint-target: "blueprint.json"
          prove: "require-deductive"
